name: Docs Link Check

on:
  push:
    paths:
      - 'DOCS/**/*.md'
      - 'README.md'
      - '.github/workflows/docs-link-check.yml'
  pull_request:
    paths:
      - 'DOCS/**/*.md'
      - 'README.md'
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Links
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          # Check all markdown files in root and DOCS
          # Exclude node_modules to ensure speed
          args: --verbose --no-progress --exclude-path 'node_modules' './**/*.md'
          # Fail if broken links are found
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
